<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Carregando...</title>
    
    <link rel="icon" type="image/jpg" href="assets/perfil.jpg">

    <meta property="og:title" content="Pedro Nichollas | Portfólio Tech">
    <meta property="og:description" content="Desenvolvedor Fullstack, Oracle ERP e Design. Confira meus projetos.">
    <meta property="og:image" content="assets/perfil.jpg">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="news-ticker-container">
        <span class="ticker-label" id="ticker-label">LOADING...</span>
        <div class="ticker-wrap">
            <div class="ticker-move" id="news-feed">
                <div class="ticker-item">Inicializando sistema...</div>
            </div>
        </div>
    </div>

    <aside class="gx-sidebar">
        <div class="gx-logo"><i class="fa-solid fa-gamepad"></i></div>
        <div class="gx-title">GAMES</div>
        <div id="games-container-pc"></div> </aside>
    
    <audio id="live-radio"></audio>

    <nav class="navbar">
        <div class="left-section">
            <div class="logo">PNP <span class="blink">_</span></div>
            
            <div class="radio-panel">
                <div class="radio-screen">
                    <span class="status-led"></span>
                    <select id="radio-selector" class="radio-select-custom" aria-label="Escolha a rádio" title="Estações de Rádio"></select>
                </div>
                <div class="radio-keys">
                    <button id="btn-play" class="mech-btn play-btn" title="Iniciar Transmissão"><span class="btn-face">▶</span></button>
                    <button id="btn-stop" class="mech-btn stop-btn" title="Encerrar"><span class="btn-face">■</span></button>
                </div>
                <div class="vol-wrapper">
                     <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3" aria-label="Controle de volume da rádio" title="Volume">
                </div>
            </div>

            <div class="tools-group">
                <div class="settings-panel">
                    <button id="btn-settings" class="mech-btn settings-btn custom-tooltip-container" data-tooltip="TEMA DO SISTEMA" aria-label="Alterar tema do sistema">
                        <span class="btn-face"><i class="fa-solid fa-palette" aria-hidden="true"></i></span>
                    </button>
                    <div class="color-picker-tooltip" id="color-picker">
                        <span class="picker-title">SYSTEM THEME</span>
                        <div class="colors-grid" id="colors-container"></div>
                    </div>
                </div>

                <button id="btn-contact-modal" class="mech-btn tool-btn custom-tooltip-container" data-tooltip="INICIAR CONEXÃO" aria-label="Abrir formulário de contato">
                    <span class="btn-face"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
                </button>
                
                <a href="cv.html?action=print" target="_blank" class="mech-btn tool-btn custom-tooltip-container" data-tooltip="DOWNLOAD CV" aria-label="Fazer download do currículo">
                    <span class="btn-face"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i></span>
                </a>

                <div class="visitor-counter custom-tooltip-container" data-tooltip="VISITANTES" aria-label="Contador de visitantes">
                    <span class="visit-icon" aria-hidden="true">👁</span>
                    <span id="visit-count">000000</span>
                </div>
            </div>
        </div>

        <ul class="menu" id="menu-dinamico"></ul>

        <button id="menu-toggle" class="menu-toggle-btn">☰</button>

        <div class="mobile-sidebar" id="mobile-sidebar">
            <ul class="menu" id="menu-dinamico-mobile"></ul>
            <div class="mobile-games-section">
                <h3 class="mobile-games-title">GAMES</h3>
                <div class="mobile-games-grid" id="games-container-mobile"></div> </div>
        </div>
    </nav>

    <div class="mobile-tools-fab">
        <div class="settings-panel">
            <button id="btn-settings-mobile" class="fab-btn" title="Tema"><i class="fa-solid fa-gear"></i></button>
            <div class="color-picker-tooltip" id="color-picker-mobile">
                <div class="colors-grid" id="colors-container-mobile"></div>
            </div>
        </div>
        <button id="btn-contact-mobile" class="fab-btn" title="Mensagem"><i class="fa-solid fa-envelope"></i></button>
        <a href="cv.html?action=print" target="_blank" class="fab-btn" title="Download CV"><i class="fa-solid fa-download"></i></a>
    </div>

    <div class="mobile-radio-wrapper">
        <select id="radio-selector-mobile" class="mobile-radio-dropdown" aria-label="Escolha a rádio mobile"></select>
        <button id="mobile-radio-btn" class="fab-radio-btn" aria-label="Tocar Rádio">▶</button>
    </div>

    <section id="home" class="hero">
        <div class="hero-content">
            <div class="profile-container" id="profile-stage">
                <div class="spinner-ring"></div>
                <img src="assets/perfil.jpg" alt="Foto de Perfil" class="profile-pic">
            </div>
            
            <h1 id="perfil-nome">Carregando...</h1>
            <p class="role-text" id="perfil-cargos"></p>
            <p class="subtitle-text" id="perfil-resumo"></p>
            
            <div class="stats">
                <span class="stat-number" id="perfil-numero"></span>
                <span class="stat-label" id="perfil-nas"></span>
            </div>
        </div>
    </section>

    <section id="projetos" class="section">
        <h2 class="section-title" id="tit-projetos">MEUS PROJETOS</h2>
        <div class="grid-container" id="container-projetos"></div>
    </section>

    <section id="formacao" class="section">
        <h2 class="section-title" id="tit-formacao">FORMAÇÃO</h2>
        <div class="timeline" id="container-formacao"></div>
    </section>

    <section id="carreira" class="section">
        <h2 class="section-title" id="tit-carreira">CARREIRA</h2>
        <div class="timeline" id="container-carreira"></div>
    </section>

    <section id="certificados" class="section">
        <h2 class="section-title" id="tit-certificados">CERTIFICAÇÕES</h2>
        <div class="grid-container" id="container-certificados"></div>
    </section>

    <section id="contato" class="section">
        <h2 class="section-title" id="tit-contato">CONTATO</h2>
        <div class="contact-container" id="container-contato"></div>
    </section>

    <footer>
        <p id="footer-text">Desenvolvido por Pedro Nichollas © 2026</p>
    </footer>

    <div id="contact-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-header">
                <h3>NOVA MENSAGEM</h3>
                <button id="close-modal" class="close-btn">×</button>
            </div>
            <form id="contact-form">
                <div class="form-group">
                    <label>IDENTIFICAÇÃO (NOME):</label>
                    <input type="text" name="name" required placeholder="Digite seu nome...">
                </div>
                <div class="form-group">
                    <label>EMAIL:</label>
                    <input type="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>MENSAGEM:</label>
                    <textarea name="message" required placeholder="Digite sua mensagem..."></textarea>
                </div>
                <button type="submit" class="submit-btn">ENVIAR MENSAGEM >></button>
            </form>
        </div>
    </div>

    <canvas id="matrix-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
