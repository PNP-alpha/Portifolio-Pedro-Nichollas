<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Memory | PNP Systems</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="memory_style.css">
</head>
<body>

    <a href="../../index.html" class="universal-exit-btn">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> SISTEMA PRINCIPAL
    </a>

    <div id="start-screen" class="screen-overlay">
        <div class="terminal-window">
            <h1 class="glitch-title">DATA DECRYPT v2.0</h1>
            <p class="subtitle">SISTEMA DE EMPARELHAMENTO DE NÚCLEOS</p>
            
            <div class="leaderboard-container">
                <h3><i class="fa-solid fa-database"></i> ÚLTIMOS 10 RESULTADOS</h3>
                <table id="scores-table">
                    <thead>
                        <tr>
                            <th>INDEX</th>
                            <th>DATA/HORA</th>
                            <th>SCORE</th>
                        </tr>
                    </thead>
                    <tbody id="scores-body">
                        </tbody>
                </table>
            </div>
            
            <button id="btn-start" class="cyber-start-btn">
                <span class="btn-glow"></span>
                INICIAR DECRIPTAÇÃO
            </button>
        </div>
    </div>

    <div class="game-wrapper">
        <div class="hud-top">
            <div class="hud-item">
                <span class="hud-label">TEMPO</span>
                <span class="hud-value" id="time-left">01:00</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span class="hud-value score-text" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">TENTATIVAS</span>
                <span class="hud-value" id="flips">0</span>
            </div>
        </div>

        <div class="memory-board" id="board">
            </div>
        
        <div class="controls-hint">
            <p>[CLIQUE] Selecionar Bloco de Dados | [ESC] Sair para o Menu</p>
        </div>
    </div>

    <script src="memory_script.js"></script>
</body>
</html>
